<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="-apple-system, system-ui, sans-serif" font-size="14">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .axis-label { font-size: 13px; fill: #222; font-weight: 600; }
    .grid { stroke: #d0d0d0; stroke-width: 1; fill: none; }
    .ring-label { font-size: 10px; fill: #888; }
    .legend { font-size: 13px; fill: #222; }
    .hs-fill { fill: #e94e77; fill-opacity: 0.25; stroke: #e94e77; stroke-width: 2.5; }
    .hs-dot { fill: #e94e77; }
    .hsold-fill { fill: none; stroke: #e94e77; stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.55; }
    .gin-fill { fill: #2e86c1; fill-opacity: 0.20; stroke: #2e86c1; stroke-width: 2.5; }
    .gin-dot { fill: #2e86c1; }
  </style>

  <text x="450" y="36" text-anchor="middle" class="title">HyperServe vs Gin — post-sweep comparison</text>
  <text x="450" y="58" text-anchor="middle" class="subtitle">Dashed pink: HyperServe BEFORE the sweep. Solid pink: AFTER. Blue: Gin v1.12.0. Score 0–10. Centre = 0.</text>

  <!-- Radar geometry: cx=450, cy=420, R=240. 8 axes at 45° steps starting from -90 (top). -->
  <g transform="translate(450,420)">
    <!-- concentric rings -->
    <polygon class="grid" points="0,-48 33.94,-33.94 48,0 33.94,33.94 0,48 -33.94,33.94 -48,0 -33.94,-33.94" />
    <polygon class="grid" points="0,-96 67.88,-67.88 96,0 67.88,67.88 0,96 -67.88,67.88 -96,0 -67.88,-67.88" />
    <polygon class="grid" points="0,-144 101.82,-101.82 144,0 101.82,101.82 0,144 -101.82,101.82 -144,0 -101.82,-101.82" />
    <polygon class="grid" points="0,-192 135.76,-135.76 192,0 135.76,135.76 0,192 -135.76,135.76 -192,0 -135.76,-135.76" />
    <polygon class="grid" points="0,-240 169.71,-169.71 240,0 169.71,169.71 0,240 -169.71,169.71 -240,0 -169.71,-169.71" />

    <!-- spokes -->
    <line class="grid" x1="0" y1="0" x2="0" y2="-240" />
    <line class="grid" x1="0" y1="0" x2="169.71" y2="-169.71" />
    <line class="grid" x1="0" y1="0" x2="240" y2="0" />
    <line class="grid" x1="0" y1="0" x2="169.71" y2="169.71" />
    <line class="grid" x1="0" y1="0" x2="0" y2="240" />
    <line class="grid" x1="0" y1="0" x2="-169.71" y2="169.71" />
    <line class="grid" x1="0" y1="0" x2="-240" y2="0" />
    <line class="grid" x1="0" y1="0" x2="-169.71" y2="-169.71" />

    <!-- ring labels along top spoke -->
    <text x="6" y="-48" class="ring-label">2</text>
    <text x="6" y="-96" class="ring-label">4</text>
    <text x="6" y="-144" class="ring-label">6</text>
    <text x="6" y="-192" class="ring-label">8</text>
    <text x="6" y="-240" class="ring-label">10</text>

    <!-- Scores:
         Axis             HS-old  HS-new  Gin    radius (×24)
         1 Maturity         3      5     9      72/120/216  (top, -90)
         2 Performance      5      6     9      120/144/216 (-45)
         3 Community/docs   2      3     10     48/72/240   (0)
         4 Lightweight     10     10     3      240/240/72  (45)
         5 Feature breadth  4      7     9      96/168/216  (90)
         6 AI/MCP-native   10     10     1      240/240/24  (135)
         7 WS+SSE native    9      9     3      216/216/72  (180)
         8 Control/small   10     10     4      240/240/96  (-135)

         Coordinates: x = r·cos(angle), y = r·sin(angle).
    -->

    <!-- HyperServe — old (dashed outline only). -->
    <polygon class="hsold-fill" points="
      0,-72
      84.85,-84.85
      48,0
      169.71,169.71
      0,96
      -169.71,169.71
      -216,0
      -169.71,-169.71" />

    <!-- HyperServe — new (filled). -->
    <polygon class="hs-fill" points="
      0,-120
      101.82,-101.82
      72,0
      169.71,169.71
      0,168
      -169.71,169.71
      -216,0
      -169.71,-169.71" />

    <!-- Gin polygon. -->
    <polygon class="gin-fill" points="
      0,-216
      152.74,-152.74
      240,0
      50.91,50.91
      0,216
      -16.97,16.97
      -72,0
      -67.88,-67.88" />

    <!-- HyperServe vertices (new). -->
    <circle class="hs-dot" cx="0" cy="-120" r="3.5" />
    <circle class="hs-dot" cx="101.82" cy="-101.82" r="3.5" />
    <circle class="hs-dot" cx="72" cy="0" r="3.5" />
    <circle class="hs-dot" cx="169.71" cy="169.71" r="3.5" />
    <circle class="hs-dot" cx="0" cy="168" r="3.5" />
    <circle class="hs-dot" cx="-169.71" cy="169.71" r="3.5" />
    <circle class="hs-dot" cx="-216" cy="0" r="3.5" />
    <circle class="hs-dot" cx="-169.71" cy="-169.71" r="3.5" />

    <!-- Gin vertices. -->
    <circle class="gin-dot" cx="0" cy="-216" r="3.5" />
    <circle class="gin-dot" cx="152.74" cy="-152.74" r="3.5" />
    <circle class="gin-dot" cx="240" cy="0" r="3.5" />
    <circle class="gin-dot" cx="50.91" cy="50.91" r="3.5" />
    <circle class="gin-dot" cx="0" cy="216" r="3.5" />
    <circle class="gin-dot" cx="-16.97" cy="16.97" r="3.5" />
    <circle class="gin-dot" cx="-72" cy="0" r="3.5" />
    <circle class="gin-dot" cx="-67.88" cy="-67.88" r="3.5" />
  </g>

  <!-- Axis labels (absolute coords). -->
  <text x="450" y="160" text-anchor="middle" class="axis-label">Maturity</text>
  <text x="450" y="176" text-anchor="middle" class="subtitle">HS 3→5 · Gin 9</text>

  <text x="640" y="232" text-anchor="middle" class="axis-label">Performance</text>
  <text x="640" y="248" text-anchor="middle" class="subtitle">HS 5→6 · Gin 9</text>

  <text x="710" y="420" text-anchor="start" class="axis-label">Community &amp; docs</text>
  <text x="710" y="438" text-anchor="start" class="subtitle">HS 2→3 · Gin 10</text>

  <text x="640" y="678" text-anchor="middle" class="axis-label">Lightweight (1 vs 13+ deps)</text>
  <text x="640" y="694" text-anchor="middle" class="subtitle">HS 10 · Gin 3</text>

  <text x="450" y="708" text-anchor="middle" class="axis-label">Feature breadth</text>
  <text x="450" y="724" text-anchor="middle" class="subtitle">HS 4→7 · Gin 9</text>

  <text x="260" y="678" text-anchor="middle" class="axis-label">AI / MCP-native</text>
  <text x="260" y="694" text-anchor="middle" class="subtitle">HS 10 · Gin 1</text>

  <text x="190" y="420" text-anchor="end" class="axis-label">WS + SSE native</text>
  <text x="190" y="438" text-anchor="end" class="subtitle">HS 9 · Gin 3</text>

  <text x="260" y="232" text-anchor="middle" class="axis-label">Control / small surface</text>
  <text x="260" y="248" text-anchor="middle" class="subtitle">HS 10 · Gin 4</text>

  <!-- Legend. -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="260" height="78" fill="#fafafa" stroke="#ddd" />
    <rect x="14" y="12" width="18" height="12" fill="#e94e77" fill-opacity="0.35" stroke="#e94e77" stroke-width="2" />
    <text x="40" y="23" class="legend">HyperServe AFTER sweep (this run)</text>
    <line x1="14" y1="42" x2="32" y2="42" stroke="#e94e77" stroke-width="2" stroke-dasharray="4 3" opacity="0.7" />
    <text x="40" y="46" class="legend">HyperServe BEFORE sweep</text>
    <rect x="14" y="56" width="18" height="12" fill="#2e86c1" fill-opacity="0.30" stroke="#2e86c1" stroke-width="2" />
    <text x="40" y="67" class="legend">Gin v1.12.0</text>
  </g>

  <!-- Average box. -->
  <g transform="translate(580,80)">
    <rect x="0" y="0" width="260" height="78" fill="#fafafa" stroke="#ddd" />
    <text x="14" y="22" class="legend" font-weight="700">Unweighted average</text>
    <text x="14" y="42" class="legend"><tspan fill="#e94e77">HS new 7.5</tspan> · was 6.6 · <tspan fill="#2e86c1">Gin 6.0</tspan></text>
    <text x="14" y="62" class="subtitle">+0.9 points: maturity, perf, breadth.</text>
  </g>
</svg>
