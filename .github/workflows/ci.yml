name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Install check-gate tools
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

    - name: make test (runs check gate + go test)
      run: make test

    - name: Race detector
      run: make test-race

    - name: Fuzz smoke (15s × 4 targets)
      run: make fuzz-smoke

    - name: Build
      run: go build -v ./...

    - name: Build scaffold CLI
      run: go build -v ./cmd/hyperserve-init

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Run benchmarks
      run: go test -bench=. -benchmem ./...
