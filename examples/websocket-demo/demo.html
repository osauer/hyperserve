<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperServe WebSocket echo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 42rem; margin: 4rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .7rem; }
    button { padding: .7rem 1rem; }
    #status { color: #687078; }
    #messages { padding-left: 1.25rem; }
  </style>
</head>
<body>
  <h1>WebSocket echo</h1>
  <p id="status">Connecting…</p>
  <form id="echo-form">
    <input id="message" value="Hello, HyperServe" aria-label="Message" disabled>
    <button id="send" disabled>Send</button>
  </form>
  <ul id="messages" aria-live="polite"></ul>

  <script>
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${scheme}://${location.host}/ws/echo`);
    const status = document.querySelector("#status");
    const input = document.querySelector("#message");
    const send = document.querySelector("#send");
    const messages = document.querySelector("#messages");

    socket.addEventListener("open", () => {
      status.textContent = "Connected with the server's same-origin policy.";
      input.disabled = false;
      send.disabled = false;
      input.focus();
    });

    socket.addEventListener("message", event => {
      const item = document.createElement("li");
      item.textContent = `Echo: ${event.data}`;
      messages.append(item);
    });

    socket.addEventListener("close", () => {
      status.textContent = "Disconnected.";
      input.disabled = true;
      send.disabled = true;
    });

    socket.addEventListener("error", () => {
      status.textContent = "Connection failed; check the server log.";
    });

    document.querySelector("#echo-form").addEventListener("submit", event => {
      event.preventDefault();
      if (input.value !== "") {
        socket.send(input.value);
        input.select();
      }
    });
  </script>
</body>
</html>
